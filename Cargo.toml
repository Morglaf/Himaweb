[package]
name = "himaweb"
version = "0.1.0"
edition = "2021"
description = "Local web GUI for Himalaya (and Cardamum/Calendula)"

[dependencies]
axum = { version = "0.8", features = ["multipart", "form"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
askama = { version = "0.12", features = ["serde-json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
form_urlencoded = "1.2"
ammonia = "4"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
mime_guess = "2"
tempfile = "3"
which = "7"
regex = "1"
urlencoding = "2"
toml = "0.8"
toml_edit = "0.22"

[profile.release]
lto = true
codegen-units = 1
strip = true
