[package]
name = "himaweb"
version = "0.1.8"
edition = "2021"
description = "Local web GUI for Himalaya (and Cardamum/Calendula)"
license = "GPL-3.0-only"
repository = "https://github.com/Morglaf/Himaweb"
readme = "README.md"
keywords = ["email", "himalaya", "pimalaya", "gui", "web"]
categories = ["command-line-utilities", "email"]

[dependencies]
axum = { version = "0.8", features = ["multipart", "form"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
askama = { version = "0.12", features = ["serde-json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
form_urlencoded = "1.2"
ammonia = "4"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
mime_guess = "2"
tempfile = "3"
which = "7"
regex = "1"
urlencoding = "2"
toml = "0.8"
toml_edit = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
tray-icon = "0.19"
muda = "0.15"
open = "5"
base64 = "0.22"
zip = { version = "2", features = ["deflate"] }
tcard = { version = "0.2.0", default-features = false }
vcard-rs = { version = "0.4", default-features = false }
tcal = { version = "0.2.0", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true

[target."cfg(windows)".dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Console"] }
