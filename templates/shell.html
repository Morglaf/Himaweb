<!DOCTYPE html>
<html lang="fr" data-theme="{{ theme }}" data-layout="{{ layout }}" data-topbar="{{ topbar_mode }}" style="{{ ui_style }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/app.css?v={{ crate::assets::version() }}" />
  <script src="/static/vendor/htmx.min.js?v={{ crate::assets::version() }}"></script>
  <script>
    // App locale de confiance : autoriser les scripts dans les fragments HTMX
    htmx.config.allowScriptTags = true;
  </script>
  <script src="/static/vendor/lucide.min.js?v={{ crate::assets::version() }}"></script>
  <script defer src="/static/app.js?v={{ crate::assets::version() }}"></script>
  <script defer src="/static/vendor/alpine.min.js?v={{ crate::assets::version() }}"></script>
  <!-- Quill ne sert qu'à la rédaction : chargé à la demande par ensureQuill() -->
  <!-- Inter en non bloquant : var(--font) retombe sur la police système en attendant -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand" title="HimaWeb" aria-label="HimaWeb">
      <i data-lucide="mountain"></i>
    </a>
    <nav class="top-nav">
      <a href="/" class="tab {% if active_tab == "mail" %}tab-active{% endif %}" data-i18n-title="nav.mail" title="Mail"><i data-lucide="mail"></i><span class="tab-label" data-i18n="nav.mail">Mail</span> <span id="unread-badge" class="nav-badge" hidden>0</span></a>
      <a href="/search" class="tab {% if active_tab == "search" %}tab-active{% endif %}" data-i18n-title="nav.search" title="Recherche"><i data-lucide="search"></i><span class="tab-label" data-i18n="nav.search">Recherche</span></a>
      <a href="/contacts" class="tab {% if active_tab == "contacts" %}tab-active{% endif %}" data-i18n-title="nav.contacts" title="Contacts"><i data-lucide="contact"></i><span class="tab-label" data-i18n="nav.contacts">Contacts</span></a>
      <a href="/calendar" class="tab {% if active_tab == "calendar" %}tab-active{% endif %}" data-i18n-title="nav.calendar" title="Calendrier"><i data-lucide="calendar"></i><span class="tab-label" data-i18n="nav.calendar">Calendrier</span></a>
    </nav>
    <div class="top-right">
      <div class="top-status">
        {% if offline %}<span class="badge-offline" data-i18n="badge.offline">Hors-ligne</span>{% endif %}
        {% if !himalaya_available %}<span class="badge-warn" data-i18n="badge.himalaya_missing">Himalaya absent</span>{% endif %}
      </div>
      <a href="/settings" class="tab tab-settings {% if active_tab == "settings" %}tab-active{% endif %}" data-i18n-title="nav.settings" title="Paramètres"><i data-lucide="settings"></i><span class="tab-label" data-i18n="nav.settings">Paramètres</span></a>
    </div>
  </header>

  {% if let Some(err) = error %}
  <div class="page-error">{{ err }}</div>
  {% endif %}

  <main class="page-main {% if active_tab == "mail" || active_tab == "search" %}page-main-mail{% endif %}">
    {{ content|safe }}
  </main>

  <div id="compose-layer" aria-live="polite"></div>
  <div id="htmx-sink" class="sr-only" aria-hidden="true"></div>
  <!-- Icônes rendues par app.js au DOMContentLoaded (rendu scopé, voir hwRenderIcons) -->
</body>
</html>
