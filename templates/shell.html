<!DOCTYPE html>
<html lang="fr" data-theme="{{ theme }}" data-layout="{{ layout }}" data-topbar="{{ topbar_mode }}" style="{{ ui_style }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script>
    // App locale de confiance : autoriser les scripts dans les fragments HTMX
    htmx.config.allowScriptTags = true;
  </script>
  <script defer src="/static/app.js?v=20261001m"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/lucide@0.469.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" />
  <link rel="stylesheet" href="/static/app.css?v=20261001n" />
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand" title="HimaWeb" aria-label="HimaWeb">
      <i data-lucide="mountain"></i>
    </a>
    <nav class="top-nav">
      <a href="/" class="tab {% if active_tab == "mail" %}tab-active{% endif %}" title="Mail"><i data-lucide="mail"></i><span class="tab-label">Mail</span> <span id="unread-badge" class="nav-badge" hidden>0</span></a>
      <a href="/search" class="tab {% if active_tab == "search" %}tab-active{% endif %}" title="Recherche"><i data-lucide="search"></i><span class="tab-label">Recherche</span></a>
      <a href="/contacts" class="tab {% if active_tab == "contacts" %}tab-active{% endif %}" title="Contacts"><i data-lucide="contact"></i><span class="tab-label">Contacts</span></a>
      <a href="/calendar" class="tab {% if active_tab == "calendar" %}tab-active{% endif %}" title="Calendrier"><i data-lucide="calendar"></i><span class="tab-label">Calendrier</span></a>
    </nav>
    <div class="top-right">
      <div class="top-status">
        {% if offline %}<span class="badge-offline">Hors-ligne</span>{% endif %}
        {% if !himalaya_available %}<span class="badge-warn">Himalaya absent</span>{% endif %}
      </div>
      <a href="/settings" class="tab tab-settings {% if active_tab == "settings" %}tab-active{% endif %}" title="Paramètres"><i data-lucide="settings"></i><span class="tab-label">Paramètres</span></a>
    </div>
  </header>

  {% if let Some(err) = error %}
  <div class="page-error">{{ err }}</div>
  {% endif %}

  <main class="page-main {% if active_tab == "mail" || active_tab == "search" %}page-main-mail{% endif %}">
    {{ content|safe }}
  </main>

  <div id="compose-layer" aria-live="polite"></div>
  <div id="htmx-sink" class="sr-only" aria-hidden="true"></div>

  <script>lucide.createIcons()</script>
</body>
</html>
