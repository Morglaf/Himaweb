<div class="compose-backdrop"
     :class="'compose-mode-' + windowMode"
     x-data="composeForm()"
     x-init="boot()"
     @keydown.escape.window="onEscape($event)"
     @click.self="windowMode === 'normal' && goBack()">
  <div class="modal-panel compose-modal-panel"
       role="dialog"
       aria-modal="true"
       @click.stop
       :class="'is-' + windowMode">
    <div class="modal-head" @dblclick="toggleMinimize()">
      <h2 class="font-display text-xl compose-title" @click="windowMode === 'minimized' && setWindow('docked')"
          x-text="displayTitle">{{ title }}</h2>
      <div class="compose-window-actions">
        <button type="button" class="icon-btn" title="Ancrer en bas" @click="setWindow('docked')" x-show="windowMode === 'normal'">
          <i data-lucide="panel-bottom"></i>
        </button>
        <button type="button" class="icon-btn" title="Plein centre" @click="setWindow('normal')" x-show="windowMode !== 'normal'">
          <i data-lucide="maximize-2"></i>
        </button>
        <button type="button" class="icon-btn" title="Réduire" @click="setWindow('minimized')" x-show="windowMode !== 'minimized'">
          <i data-lucide="minus"></i>
        </button>
        <button type="button" class="icon-btn" title="Agrandir" @click="setWindow('docked')" x-show="windowMode === 'minimized'">
          <i data-lucide="square"></i>
        </button>
        <button type="button" class="icon-btn" title="Fermer" @click="goBack()"><i data-lucide="x"></i></button>
      </div>
    </div>

    <div class="compose-body" x-show="windowMode !== 'minimized'" x-cloak>
      {% if let Some(e) = error %}
      <div class="error-banner mb-3">{{ e }}</div>
      {% endif %}

      <script type="application/json" id="compose-boot">{{ compose_boot|safe }}</script>
      <textarea id="compose-body-seed" class="sr-only" readonly>{{ body }}</textarea>

      <form method="post" action="/compose/send" class="compose-form" enctype="multipart/form-data"
            @submit="onSubmit($event)">
        <input type="hidden" name="account" :value="account" />
        <input type="hidden" name="html" :value="bodyMode === 'html' ? '1' : '0'" />
        <input type="hidden" name="body_html" :value="bodyHtml" />

        <template x-if="ai">
          <div class="compose-ai-row">
            <input class="input compose-ai-input" type="text" x-model="aiPrompt"
                   placeholder="prompt…"
                   @keydown.enter.prevent="fillAi()" />
            <button type="button" class="icon-btn compose-ai-run" @click="fillAi()" :disabled="aiBusy"
                    :title="aiBusy ? 'Génération…' : 'Générer avec l’IA'">
              <i data-lucide="sparkles"></i>
            </button>
            <p class="muted tiny compose-ai-error" x-show="aiError" x-text="aiError"></p>
          </div>
        </template>

        <div class="compose-toolbar" :data-mode="toolbarMode">
          <button type="button" class="compose-tool" :class="showCc && 'is-active'"
                  @click="showCc = !showCc; $nextTick(() => lucide.createIcons())"
                  title="Copie à">
            <i data-lucide="users"></i>
            <span class="compose-tool-label">Copie à</span>
          </button>
          <button type="button" class="compose-tool" :class="showBcc && 'is-active'"
                  @click="showBcc = !showBcc; $nextTick(() => lucide.createIcons())"
                  title="Copie cachée à">
            <i data-lucide="user-round-cog"></i>
            <span class="compose-tool-label">Copie cachée à</span>
          </button>
          <button type="button" class="compose-tool" :class="showReplyTo && 'is-active'"
                  @click="showReplyTo = !showReplyTo; $nextTick(() => lucide.createIcons())"
                  title="Répondre à">
            <i data-lucide="reply"></i>
            <span class="compose-tool-label">Répondre à</span>
          </button>
          <button type="button" class="compose-tool"
                  @click="setBodyMode(bodyMode === 'html' ? 'plain' : 'html')"
                  :title="bodyMode === 'html' ? 'Passer en texte brut' : 'Passer en HTML'">
            <i :data-lucide="bodyMode === 'html' ? 'file-code' : 'file-text'"></i>
            <span class="compose-tool-label" x-text="bodyMode === 'html' ? 'HTML' : 'Texte brut'"></span>
          </button>
          <button type="button" class="compose-tool"
                  @click="$refs.attachInput && $refs.attachInput.click()"
                  title="Pièce jointe">
            <i data-lucide="paperclip"></i>
            <span class="compose-tool-label">Pièce jointe</span>
          </button>
          <input class="sr-only" type="file" name="attachments" multiple x-ref="attachInput"
                 @change="onFilesChange($event)" id="compose-attach-input" />
        </div>

        <div class="compose-inline-row">
          <span class="label">De :</span>
          <div class="from-dropdown" @click.outside="fromOpen = false">
            <button type="button" class="from-trigger" @click="fromOpen = !fromOpen; $nextTick(() => lucide.createIcons())">
              <span class="acct-ico" :style="'color:' + (selectedAccount && selectedAccount.color ? selectedAccount.color : 'var(--accent)')">
                <i :data-lucide="(selectedAccount && selectedAccount.icon) || 'mail'"></i>
              </span>
              <span class="from-email" x-text="(selectedAccount && (selectedAccount.email || selectedAccount.name)) || 'Choisir…'"></span>
              <i data-lucide="chevron-down" class="from-chevron"></i>
            </button>
            <ul class="from-menu" x-show="fromOpen" x-cloak>
              <template x-for="a in accounts" :key="a.name">
                <li>
                  <button type="button" class="from-option" :class="account === a.name && 'is-selected'"
                          @click="pickAccount(a)">
                    <span class="acct-ico" :style="'color:' + (a.color || 'var(--accent)')">
                      <i :data-lucide="a.icon || 'mail'"></i>
                    </span>
                    <span class="from-email" x-text="a.email || a.name"></span>
                  </button>
                </li>
              </template>
            </ul>
          </div>
        </div>

        <div class="compose-inline-row">
          <span class="label">À</span>
          <div class="suggest-wrap grow">
            <input class="input w-full" type="text" name="to" x-model="to" @input.debounce.200ms="suggest('to')"
                   autocomplete="off" required />
            <ul class="suggest" x-show="suggestions.to.length > 0" x-cloak>
              <template x-for="item in suggestions.to" :key="item.email">
                <li @mousedown.prevent="pick('to', item)" x-text="item.label"></li>
              </template>
            </ul>
          </div>
        </div>

        <div x-show="showCc || cc" x-cloak class="compose-inline-row">
          <span class="label">Cc</span>
          <div class="suggest-wrap grow">
            <input class="input w-full" type="text" name="cc" x-model="cc" @input.debounce.200ms="suggest('cc')"
                   autocomplete="off" />
            <ul class="suggest" x-show="suggestions.cc.length > 0" x-cloak>
              <template x-for="item in suggestions.cc" :key="item.email">
                <li @mousedown.prevent="pick('cc', item)" x-text="item.label"></li>
              </template>
            </ul>
          </div>
        </div>

        <div x-show="showBcc || bcc" x-cloak class="compose-inline-row">
          <span class="label">Cci</span>
          <div class="suggest-wrap grow">
            <input class="input w-full" type="text" name="bcc" x-model="bcc" @input.debounce.200ms="suggest('bcc')"
                   autocomplete="off" />
            <ul class="suggest" x-show="suggestions.bcc.length > 0" x-cloak>
              <template x-for="item in suggestions.bcc" :key="item.email">
                <li @mousedown.prevent="pick('bcc', item)" x-text="item.label"></li>
              </template>
            </ul>
          </div>
        </div>

        <div x-show="showReplyTo || replyTo" x-cloak class="compose-inline-row">
          <span class="label">Répondre à</span>
          <div class="suggest-wrap grow">
            <input class="input w-full" type="text" name="reply_to" x-model="replyTo"
                   autocomplete="off" placeholder="adresse@exemple.com" />
          </div>
        </div>

        <div class="compose-inline-row">
          <span class="label">Sujet</span>
          <input class="input w-full grow" type="text" name="subject" x-model="subject" />
        </div>

        <div class="compose-field">
          <textarea class="input w-full compose-plain" name="body" rows="10" x-model="body"
                    x-show="bodyMode === 'plain'" x-cloak placeholder="Message…"></textarea>
          <div x-show="bodyMode === 'html'" x-cloak class="compose-quill-wrap">
            <div id="compose-quill" class="compose-quill"></div>
          </div>
        </div>

        <ul class="compose-attach-chips" x-show="attachNames.length" x-cloak>
          <template x-for="(n, idx) in attachNames" :key="n + '-' + idx">
            <li class="compose-attach-chip">
              <i data-lucide="paperclip"></i>
              <span x-text="n"></span>
              <button type="button" class="compose-attach-remove" title="Retirer"
                      @click="removeAttach(idx)">
                <i data-lucide="x"></i>
              </button>
            </li>
          </template>
        </ul>

        <div class="btn-row compose-actions">
          <button type="submit" class="btn" name="action" value="send">Envoyer</button>
          <button type="submit" class="btn secondary" formaction="/compose/draft" name="save_draft" value="1"
                  :disabled="draftBusy" x-text="draftBusy ? 'Enregistrement…' : 'Brouillon'"></button>
          <button type="button" class="btn ghost" @click="goBack()">Annuler</button>
        </div>
      </form>
    </div>
  </div>
</div>
