name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: himaweb.x86_64-linux.tgz
            bin: himaweb
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: himaweb.aarch64-linux.tgz
            bin: himaweb
          - os: macos-13
            target: x86_64-apple-darwin
            asset: himaweb.x86_64-darwin.tgz
            bin: himaweb
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: himaweb.aarch64-darwin.tgz
            bin: himaweb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: himaweb.x86_64-windows
            bin: himaweb.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps (tray / GTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          staging=$(mktemp -d)
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$staging/"
          tar -C "$staging" -czf "${{ matrix.asset }}" "${{ matrix.bin }}"
          echo "ASSET=${{ matrix.asset }}" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\himaweb-pkg" -Force
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.bin }}" $staging.FullName
          $tgz = "himaweb.x86_64-windows.tgz"
          $zip = "himaweb.x86_64-windows.zip"
          tar -C $staging.FullName -czf $tgz "${{ matrix.bin }}"
          Compress-Archive -Path (Join-Path $staging.FullName "${{ matrix.bin }}") -DestinationPath $zip -Force
          "ASSET_TGZ=$tgz" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ASSET_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Unix asset
        if: runner.os != 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload Windows assets
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET_TGZ }}
            ${{ env.ASSET_ZIP }}
          generate_release_notes: true
          fail_on_unmatched_files: true
