name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: himaweb.x86_64-linux.tgz
            bin: himaweb
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: himaweb.aarch64-linux.tgz
            bin: himaweb
          # macos-13 (Intel) est retiré / file infinie — on cross-compile depuis Apple Silicon.
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: himaweb.x86_64-darwin.tgz
            bin: himaweb
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: himaweb.aarch64-darwin.tgz
            bin: himaweb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: himaweb.x86_64-windows
            bin: himaweb.exe

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux deps (tray / GTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          staging=$(mktemp -d)
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$staging/"
          tar -C "$staging" -czf "${{ matrix.asset }}" "${{ matrix.bin }}"
          echo "ASSET=${{ matrix.asset }}" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\himaweb-pkg" -Force
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.bin }}" $staging.FullName
          $tgz = "himaweb.x86_64-windows.tgz"
          $zip = "himaweb.x86_64-windows.zip"
          tar -C $staging.FullName -czf $tgz "${{ matrix.bin }}"
          Compress-Archive -Path (Join-Path $staging.FullName "${{ matrix.bin }}") -DestinationPath $zip -Force
          "ASSET_TGZ=$tgz" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ASSET_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Inno Setup installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $exe = Resolve-Path "target\${{ matrix.target }}\release\${{ matrix.bin }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$ver" `
            "/DMyAppExeSource=$exe" `
            "installer\himaweb.iss"
          if (-not (Test-Path "dist\HimaWeb-Setup-x64.exe")) {
            throw "HimaWeb-Setup-x64.exe manquant"
          }
          "ASSET_SETUP=dist\HimaWeb-Setup-x64.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Unix asset
        if: runner.os != 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload Windows assets
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET_TGZ }}
            ${{ env.ASSET_ZIP }}
            ${{ env.ASSET_SETUP }}
          generate_release_notes: true
          fail_on_unmatched_files: true

  winget:
    name: Submit Winget update
    needs: build
    runs-on: windows-latest
    continue-on-error: true
    # Nécessite le secret WINGET_PAT (PAT avec droit PR sur microsoft/winget-pkgs).
    # Sans secret, le job no-op. Première publication : wingetcreate new (notes perso README.winget.md).
    steps:
      - name: Skip if no WINGET_PAT
        id: gate
        shell: pwsh
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINGET_PAT)) {
            Write-Host "Secret WINGET_PAT absent — skip publication Winget."
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Install wingetcreate
        if: steps.gate.outputs.skip != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/microsoft/winget-create/releases/latest/download/wingetcreate.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\wingetcreate.exe" -UseBasicParsing

      - name: wingetcreate update
        if: steps.gate.outputs.skip != 'true'
        shell: pwsh
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $setupUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/HimaWeb-Setup-x64.exe"
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $r = Invoke-WebRequest -Uri $setupUrl -Method Head -UseBasicParsing
              if ($r.StatusCode -ge 200 -and $r.StatusCode -lt 400) { $ok = $true; break }
            } catch { }
            Start-Sleep -Seconds 10
          }
          if (-not $ok) { throw "Asset Setup inaccessible : $setupUrl" }
          & "$env:RUNNER_TEMP\wingetcreate.exe" update Morglaf.HimaWeb `
            --version $ver `
            --urls $setupUrl `
            --submit `
            --token $env:WINGET_PAT
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "wingetcreate a échoué (exit $LASTEXITCODE). Si le paquet n’existe pas encore dans winget-pkgs, faire un « wingetcreate new »."
            exit 1
          }
